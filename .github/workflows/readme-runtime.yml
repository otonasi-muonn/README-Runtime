# README Runtime CI: check only.
# Verifies that every committed card equals a fresh, Wasm-verified build and that the CSS
# really computes the Wasm results in real browser engines. It never builds .wasm from
# source, never commits and never pushes; if it fails, run `npx readme-runtime build`
# locally and commit the result.
name: README Runtime

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Cards up to date + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The CLI has no runtime dependencies, so no install step is needed.
      - name: readme-runtime check (read-only)
        run: node bin/readme-runtime.js check
      - name: Unit and pipeline tests
        run: node --test "test/**/*.test.js"
      - name: Nothing was modified
        run: git diff --exit-code

  browsers:
    name: CSS computes in Chromium, Firefox and WebKit (<img>, JS disabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Pixel-level comparison with the real Wasm engine
        run: node test/browser/run.js --browsers chromium,firefox,webkit
      - name: Keep screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
